[package]
name = "rbx-core"
version = "0.1.0"
edition = "2021"
# Set by a dependency, not by this crate: `image 0.25.10` declares 1.88.
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/rbx-forge/rbx-core"
description = "Shared infrastructure for the rbx-forge tools: rbxplace.toml resolution, global flags, Open Cloud HTTP client, cookie handling"
# Consumed as a git dependency pinned by tag, never from crates.io.
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# rustls with the OS trust store, not native-tls: a prebuilt Linux binary must
# not depend on the libssl the build machine had. `charset` and `http2` come
# back by name because dropping the defaults drops them too.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "gzip",
    "charset",
    "http2",
    "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Not "full": no tokio::spawn anywhere. `macros` for the test attributes,
# `time` for retry backoff, `sync` for the cached lookups.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
schemars = { version = "0.8", default-features = false, features = ["derive"], optional = true }
rbx_cookie = { version = "0.1", default-features = false }
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
bit-vec = "0.8"
colored = "2"
dialoguer = "0.11"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
# `test-util` for the paused-clock retry tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

[features]
# Adds `JsonSchema` to the config models, for tools that generate schemas.
schema = ["dep:schemars"]

[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
todo = "warn"
dbg_macro = "warn"
